name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      # musubi reads folders written on other people's machines: a Notion
      # export zipped on Windows, an Obsidian vault synced from macOS, a
      # maildir from a Linux server. Line endings, path separators and
      # normalization forms differ across all three, and every one of those
      # differences is a bug that only reproduces on one runner.
      - name: Test
        run: python -m pytest --cov=musubi --cov-report=term-missing
        env:
          PYTHONUTF8: "1"

  lint:
    name: lint, types and layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check . && python -m ruff format --check .

      - name: Types
        run: python -m mypy

      # The layering is a gate, not a guideline. ADR-0001.
      - name: Layering
        run: lint-imports

  contracts:
    name: the schemas ship inside the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # A consumer validating a manifest should not have to fetch a schema from
      # the internet, and an offline tool whose schema lives on somebody else's
      # server is not offline. `force-include` in pyproject.toml puts them in
      # the wheel; an editable install does not have them, so nothing a
      # developer runs locally would notice if the block were deleted. This is
      # what notices.
      - name: Build the wheel
        run: python -m pip install --upgrade pip build && python -m build --wheel --outdir dist

      - name: Assert the contracts are inside it
        run: |
          python - <<'PY'
          import zipfile, glob, json
          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as archive:
              held = set(archive.namelist())
              for name in ("musubi-trace-map-1.json", "musubi-sync-manifest-1.json"):
                  path = f"musubi/schemas/{name}"
                  assert path in held, f"{path} is not in {wheel}"
                  json.loads(archive.read(path))
          print("both contracts ship with the wheel")
          PY

  dependencies:
    name: the dependency count is zero
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ADR-0001: musubi is pointed at the folder holding everything its owner
      # has ever written, so the number of third parties with read access to it
      # is a number, and a number in this project is measured rather than
      # asserted. This installs the wheel into a clean environment and counts.
      #
      # It deliberately does not say "the README promises `pip install musubi`".
      # The README makes no such promise, and cannot: on PyPI the name `musubi`
      # belongs to an unrelated DNSBL checker. What is checked here is the
      # dependency count, which is true whatever the distribution ends up
      # called.
      - name: Install with no extras
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Assert nothing came with it
        run: |
          python - <<'PY'
          import importlib.metadata as md
          installed = {d.metadata["Name"].lower() for d in md.distributions()}
          # pip and its own bootstrap packaging are part of the environment,
          # not of musubi.
          allowed = {"musubi", "pip", "setuptools", "wheel", "packaging"}
          extra = sorted(installed - allowed)
          assert not extra, f"musubi pulled in runtime dependencies: {extra}"
          print("runtime dependencies:", len(extra))
          PY
