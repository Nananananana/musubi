name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      # musubi reads folders written on other people's machines: a Notion
      # export zipped on Windows, an Obsidian vault synced from macOS, a
      # maildir from a Linux server. Line endings, path separators and
      # normalization forms differ across all three, and every one of those
      # differences is a bug that only reproduces on one runner.
      - name: Test
        run: python -m pytest --cov=musubi --cov-report=term-missing
        env:
          PYTHONUTF8: "1"

  lint:
    name: lint, types and layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check . && python -m ruff format --check .

      - name: Types
        run: python -m mypy

      # The layering is a gate, not a guideline. ADR-0001.
      - name: Layering
        run: lint-imports

  dependencies:
    name: the dependency count is zero
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The README promises `pip install musubi` installs one thing. A promise
      # in a README decays; this one is checked on every push. musubi is
      # pointed at the folder holding everything its owner has ever written,
      # and the number of third parties with read access to it has to be
      # measured rather than asserted.
      - name: Install with no extras
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Assert nothing came with it
        run: |
          python - <<'PY'
          import importlib.metadata as md
          installed = {d.metadata["Name"].lower() for d in md.distributions()}
          # pip and its own bootstrap packaging are part of the environment,
          # not of musubi.
          allowed = {"musubi", "pip", "setuptools", "wheel", "packaging"}
          extra = sorted(installed - allowed)
          assert not extra, f"musubi pulled in runtime dependencies: {extra}"
          print("runtime dependencies:", len(extra))
          PY
