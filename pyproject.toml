[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "musubi"
version = "0.1.0.dev0"
description = "Local-first ingestion for generative AI. Turn exports and folders into clean, normalized documents that can still point back at the byte they came from."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Nananananana" }]
keywords = ["ingestion", "etl", "provenance", "connectors", "privacy", "rag", "local-first", "japanese"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Natural Language :: Japanese",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Filters",
    "Typing :: Typed",
]

# Zero. Not "few". See docs/adr/0001-the-domain-depends-on-nothing.md -- musubi
# is pointed at the folder that holds everything the owner has ever written,
# and every runtime dependency is code with unsupervised read access to it.
#
# **This line is the promise, and the extras below are not exceptions to it.**
# ADR-0028 allows a dependency outside the domain, optional and never required:
# `pip install musubi` still installs nothing, every default converter is still
# musubi's own, and an extra that is present is *offered* rather than claimed --
# it adds a name a settings file can use and changes no folder's output on its
# own.
dependencies = []

[project.optional-dependencies]
# Main-content extraction that wins its benchmarks, where musubi's own scan of
# tags does not: measured with tools/html_coverage.py at 6/6 boilerplate strings
# rejected against 3/6, on the same page. Apache-2.0, and every one of its own
# dependencies is Apache-2.0, BSD or MIT.
#
# The map is not lost by taking it. trafilatura returns a string, and
# `domain/alignment.py` recovers the tiling by finding that string in the
# source: 99.7% traceable on the same measurement, against html@1's 93.5%.
html = ["trafilatura>=2.0"]
# PDFium, which is Chrome's PDF engine, behind a wheel with **no dependencies of
# its own** and a BSD-3-Clause/Apache-2.0 licence.
#
# The case for it is not speed. musubi's own `pdf_text@1` scans for `N 0 obj`
# and cannot see an object that lives inside a compressed object stream --
# which is what a PDF 1.5 file is, and what every modern producer writes. On
# such a file it reports `no_pages`, correctly and uselessly. Measured with
# tools/pdf_coverage.py.
pdf = ["pypdfium2>=4"]
dev = [
    "pytest>=8",
    "pytest-cov",
    "hypothesis>=6.90",
    "ruff>=0.16",
    "mypy>=1.10",
    "import-linter>=2",
    "pre-commit",
    # Validates real manifests and trace maps against the published contracts.
    # There is no pydantic in the core (ADR-0001), so the schema and the
    # dataclasses are kept in step by a test rather than derived from one
    # another.
    "jsonschema>=4",
    # Stubs, so that the tests validating against the contracts are type-checked
    # rather than skipped over as untyped imports.
    "types-jsonschema",
    # The optional extras, so that the adapters are exercised rather than
    # skipped. A test that skips on the developer's machine and in CI is a test
    # that has never run.
    "trafilatura>=2.0",
    "pypdfium2>=4",
]

# There is deliberately no `siblings` extra yet. The only sibling musubi ever
# imports is `mamori`, in one optional adapter (ADR-0008), and that seam test
# lands in v0.6. `tsumugi` and `kiseki` are never imported at all -- musubi
# writes their published contracts (ADR-0010), so the tests that check
# conformance read schemas rather than packages. Neither project is published
# to an index, so declaring an extra now would make it unresolvable for
# everyone including CI.
#
# When it does land, the direct reference belongs in the CI job and **not
# here**. `pip install "mamori @ git+https://github.com/..."` resolves fine --
# it even wins when the name on PyPI belongs to somebody else -- but the same
# form in project metadata is a trap, and the trap has two steps:
#
#   1. hatchling refuses to build at all: "cannot be a direct reference unless
#      `tool.hatch.metadata.allow-direct-references` is set to `true`". Loud.
#   2. The shortest way to silence that is to set the flag -- after which the
#      build succeeds and `twine check` passes, and the failure has moved to
#      release day, where the index refuses the upload.
#
# Steps 1 and 2 up to `twine check` were measured here. The refusal was not,
# and will not be: uploading to PyPI is publishing, and publishing to find out
# is not a test. It is read instead from the index's own source, which is a
# better authority than the issue threads this is usually cited from --
# `warehouse/forklift/metadata.py` walks `requires_dist` and rejects any
# requirement carrying a URL, "Can't have direct dependency". No status code is
# recorded because none was observed, and the conclusion does not need one.
#
# So the danger is not step 1. It is a pull request that adds the flag to make
# step 1 go away. If one arrives, it is the wrong fix: the reference goes in CI.
#
# Delete this whole note when `mamori` is resolvable from an index, because a
# plain `mamori>=x.y` is then not a direct reference and none of the above
# applies. Nothing else closes it -- not musubi being published, not the
# distribution being renamed, not the seam test landing in v0.6. Those change
# who reads this and when; they do not change what happens to a `git+https`
# reference in project metadata.

[project.urls]
Homepage = "https://github.com/Nananananana/musubi"
Repository = "https://github.com/Nananananana/musubi"
Issues = "https://github.com/Nananananana/musubi/issues"
Changelog = "https://github.com/Nananananana/musubi/blob/main/CHANGELOG.md"

[project.scripts]
musubi = "musubi.interfaces.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/musubi"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# pytest's default marks an empty parameter set as `skip`, which spells "there
# were no cases" exactly the way it spells "this does not apply here" -- so a
# `parametrize` over a collection that has quietly become empty reports neither
# a failure nor a gap. Making it a collection error is the one spelling that
# cannot be read as everything being fine. From `iriguchi` through `manager`.
empty_parameter_set_mark = "fail_at_collect"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "S", "RUF"]
ignore = [
    "S101",   # assert: this is a test suite convention
    # Full-width and CJK characters are the subject matter, not a typo. A
    # Notion export written on a Japanese machine mixes ＵＲＬ and URL in the
    # same paragraph, and offset-preserving normalization exists precisely
    # because those are the same string and different lengths. Both forms
    # appear in code, docstrings and fixtures on purpose.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]
# A measurement script generates a population. `random` is the right tool for
# that and `secrets` is not; the seed is printed with every number precisely so
# that it is reproducible, which is the opposite of what S311 is warning about.
"tools/*" = [
    "S311",
    # `mutate.py` runs `git` and `pytest`. Both are named literally, both take
    # arguments the maintainer typed, and there is no shell.
    "S603",
    "S607",
]

[tool.mypy]
python_version = "3.12"
# Every Python file in the repository, not only the library. A checker whose
# scope is narrower than what it protects passes for the wrong reason: the
# tests are where the properties v0.2 rests on are generated, and they went
# unchecked long enough to accumulate an annotation the library had outgrown
# (`validator(schema: Path)` had been taking a `Traversable` since #58 and
# survived only because both have `read_text`).
files = ["src/musubi", "tests", "tools"]
strict = true
warn_unreachable = true

[tool.coverage.run]
source = ["src/musubi"]
